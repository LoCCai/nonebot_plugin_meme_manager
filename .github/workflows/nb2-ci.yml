name: nb2-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        # 语义索引依赖 faiss；Windows 无 3.10 wheel，故仅在非该组合下安装。
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            faiss: "--only-binary=:all: faiss-cpu"
          - os: ubuntu-latest
            python-version: "3.12"
            faiss: "--only-binary=:all: faiss-cpu"
          - os: windows-latest
            python-version: "3.10"
            faiss: ""
          - os: windows-latest
            python-version: "3.12"
            faiss: "--only-binary=:all: faiss-cpu"

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nonebot2[fastapi]" nonebot-adapter-onebot nonebot-adapter-qq \
            pytest pytest-asyncio aiohttp pillow numpy requests urllib3 certifi tqdm werkzeug httpx2
          python -m pip install ${{ matrix.faiss }}

      - name: 运行测试
        run: python -m pytest tests/nb2 -q

      - name: 插件加载冒烟
        run: python tools/smoke_load.py

      - name: WebUI 端到端自检
        run: python tools/check_webui.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法编译检查
        run: |
          python -m pip install --upgrade pip
          python -m compileall -q nb2 backend image_host config.py utils.py tools
      - name: 相对导入连通性检查
        run: python tools/check_imports.py
