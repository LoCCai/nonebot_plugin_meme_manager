name: nb2-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 语义索引依赖 faiss；Windows 无 3.10 的二进制 wheel。
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            install-faiss: "true"
          - os: ubuntu-latest
            python-version: "3.12"
            install-faiss: "true"
          - os: windows-latest
            python-version: "3.10"
            install-faiss: "false"
          - os: windows-latest
            python-version: "3.12"
            install-faiss: "true"

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 升级 pip
        run: python -m pip install --upgrade pip

      # 单行写法：Windows runner 默认 shell 是 PowerShell，
      # bash 的反斜杠续行会被当成参数传给 pip（报 Directory 不可安装）。
      - name: 安装依赖
        run: python -m pip install "nonebot2[fastapi]" nonebot-adapter-onebot nonebot-adapter-qq pytest pytest-asyncio aiohttp pillow numpy requests urllib3 certifi tqdm werkzeug httpx2

      - name: 安装 faiss（语义检索）
        if: matrix.install-faiss == 'true'
        run: "python -m pip install --only-binary=:all: faiss-cpu"

      - name: 运行测试
        run: python -m pytest tests/nb2 -q

      - name: 插件加载冒烟
        run: python tools/smoke_load.py

      - name: WebUI 端到端自检
        run: python tools/check_webui.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装校验依赖
        run: python -m pip install pyyaml

      - name: 语法编译检查
        run: python -m compileall -q nb2 backend image_host config.py utils.py tools

      - name: 相对导入连通性检查
        run: python tools/check_imports.py

      - name: 工作流自检
        run: python tools/check_workflows.py
